name: TrustGuard CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Backend & Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch CPU & Backend Dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Backend Unit Tests
        working-directory: ai-service
        run: |
          pytest tests/test_risk_engine.py tests/test_url_inspector.py tests/test_file_validation.py tests/test_log_privacy.py tests/test_redaction.py tests/test_auth.py tests/test_document.py tests/test_payment.py tests/test_persistence.py tests/test_health_and_security.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build
